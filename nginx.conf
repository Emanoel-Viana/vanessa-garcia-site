server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão do nginx
    server_tokens off;

    # ============================================================
    #  Cabeçalhos de segurança (em TODAS as respostas)
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Site estático: estilos/scripts inline + Google Fonts; imagens/vídeos próprios
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # HTML: sempre revalidar (deploy reflete na hora)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # CSS/JS: revalidar sempre
    location ~* \.(?:css|js)$ {
        expires -1;
    }

    # Imagens e fontes: cache de 1 dia
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 1d;
    }

    # Vídeo: cache de 7 dias
    location ~* \.(?:mp4|webm)$ {
        expires 7d;
    }

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 512;
}
